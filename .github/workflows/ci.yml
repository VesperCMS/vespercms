name: CI

# Every publish from vespercms.com's studio is a push to main that changes
# only its content. Those skip CI, which would spend about 46 billed minutes
# (Windows counts double) on a one-line edit: Cloudflare Pages still builds
# them, and a content error fails that build. A push that changes anything
# else as well runs everything.
on:
  pull_request:
    paths-ignore:
      - 'apps/site/src/content/**'
  push:
    branches: [main]
    paths-ignore:
      - 'apps/site/src/content/**'

# A newer push to the same branch makes an older run's result irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Nothing here writes to the repository or publishes anything.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Includes the package-boundary rules that keep Node and framework imports out of @vesper/core.
      - run: npm run lint
      # Code and config only; content and prose are excluded on purpose (.prettierignore).
      - run: npm run format:check
      # Token contrast in both themes plus the spec §10.4 design budget. axe can't measure this.
      - run: npm run a11y:contrast

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Package sources (tsc -b), package tests, e2e specs and root tool configs.
      - run: npm run typecheck
      # The playground's .astro and .ts files, with types generated by astro sync.
      - run: npm run check -w @vesper/playground
      - run: npm run check -w @vesper/site
      # vespercms.com's AGENTS.md still matches its schema (`vesper agents --check`).
      - run: npm run agents -w @vesper/site -- --check

  test:
    # Windows proves the .gitattributes rules, CRLF fixtures and path handling, since
    # Git for Windows checks out with autocrlf=true and agencies edit on Windows too.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Runs from TypeScript source through the @vesper/source condition, with no build
      # step, which is itself part of what's being tested.
      - run: npm test

  astro6:
    # Vesper supports Astro 6 and 7 (spec D1). The workspace runs on Astro 7;
    # this job installs fixtures/astro6-site (Astro 6, Vite 7) on its own.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            fixtures/astro6-site/package-lock.json
      - run: npm ci
      - run: npm ci --prefix fixtures/astro6-site
      # The astro:content shim covers Astro 6's exports, and the site's manifest is right.
      # VESPER_ASTRO6 makes a missing install fail instead of skipping.
      - run: npx vitest run --project integration packages/astro/test/astro-versions
        env:
          VESPER_ASTRO6: '1'
      # A real Astro 6 build with vesper(): the studio shell and the manifest are emitted.
      - run: npm run build --prefix fixtures/astro6-site
      - run: test -f fixtures/astro6-site/dist/admin/index.html && test -f fixtures/astro6-site/dist/_vesper/manifest.json

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Builds dist/ and imports every published entry point with the source condition off,
      # the way a site installing from npm would.
      - run: npm run check:dist
      # Static output with no adapter (spec D4).
      - run: npm run build -w @vesper/playground
      # The accessibility report (spec §6.18) is written beside dist/, never into it.
      - run: test -f apps/playground/.vesper/a11y-report.json && test -z "$(find apps/playground/dist -name '*a11y*' -o -name '.vesper')"
      - uses: actions/upload-artifact@v7
        with:
          name: playground-dist
          path: apps/playground/dist
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: playground-a11y-report
          path: apps/playground/.vesper/a11y-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      # vespercms.com, edited with Vesper; its own report goes beside dist/ too.
      - run: npm run build -w @vesper/site
      - uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: |
            apps/site/dist
            apps/site/.vesper/a11y-report.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # Test the exact files the build job produced, not a rebuild.
      - uses: actions/download-artifact@v8
        with:
          name: playground-dist
          path: apps/playground/dist
      - uses: actions/download-artifact@v8
        with:
          name: playground-a11y-report
          path: apps/playground/.vesper
      - uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: apps/site
      - run: npx playwright install --with-deps chromium
      # Every page served by the no-rewrite static server (the spec §6.16 "plain host"),
      # checked with axe; then the studio in local mode on astro dev, over a throwaway
      # copy of the playground.
      - run: npm run e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
